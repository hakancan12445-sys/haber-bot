name: Haber botu

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Sadece Telegram bağlantısını test et"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  haber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Haberleri gönder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST: ${{ inputs.test }}
        run: python haber_bot.py
